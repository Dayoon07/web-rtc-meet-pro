# 운영 배포 (서버 한 대: iwinv 2 vCPU · 8GB 기준). 사용법은 deploy/README.md
#   cp deploy/.env.example deploy/.env  →  값 채우기  →  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: limeet

# 켜고 끄는 묶음 (.env 의 COMPOSE_PROFILES): oracle = DB 도 컨테이너로 (서버에 Oracle 을 직접 설치했으면 빼기), ollama = 무료 AI
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    profiles: ["oracle"]
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?ORACLE_PASSWORD 를 .env 에 넣어 주세요}
      # 서비스와 관리자 사이트(별도 서브도메인)가 함께 쓰는 스키마. 빈 볼륨으로 처음 뜰 때만 만들어진다
      APP_USER: limeet
      APP_USER_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 넣어 주세요}
    volumes:
      - oracle-data:/opt/oracle/oradata
      # 최초 기동(빈 볼륨) 때만 스키마·시드 실행
      - ../db:/db:ro
      - ./oracle/init.sh:/container-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
    # 포트를 밖으로 열지 않는다 (서버만 도커 네트워크로 접속)

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    # 한 서버에 DB 와 같이 돌아서 메모리를 나눠 쓴다. JVM 힙은 이 값의 75% (Dockerfile 의 MaxRAMPercentage)
    mem_limit: 1536m
    depends_on:
      oracle:
        condition: service_healthy
        # Oracle 을 서버에 직접 설치했으면(profile 에 oracle 없음) 기다리지 않는다
        required: false
    extra_hosts:
      # 서버에 직접 설치한 Oracle 에 닿기 위해 (DB_URL=jdbc:oracle:thin:@//host.docker.internal:1521/FREEPDB1)
      - "host.docker.internal:host-gateway"
    environment:
      DB_URL: ${DB_URL:-jdbc:oracle:thin:@//oracle:1521/FREEPDB1}
      DB_USERNAME: limeet
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 를 .env 에 넣어 주세요}
      ALLOWED_ORIGINS: https://${DOMAIN},https://${ADMIN_DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_SUCCESS_REDIRECT: https://${DOMAIN}/oauth/callback
      OAUTH_FAILURE_REDIRECT: https://${DOMAIN}/login
      MEDIA_JWT_SECRET: ${MEDIA_JWT_SECRET:?MEDIA_JWT_SECRET 를 .env 에 넣어 주세요}
      MEDIA_INTERNAL_SECRET: ${MEDIA_INTERNAL_SECRET:?MEDIA_INTERNAL_SECRET 를 .env 에 넣어 주세요}
      # 메일 안의 링크 주소. MAIL_HOST 를 비우면 메일은 보내지 않고 로그에만 남는다
      WEB_URL: https://${DOMAIN}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-MQ <no-reply@localhost>}
      # 상태 보고 메일 (12시간마다). 미디어 사이드카는 호스트 네트워크라 host.docker.internal 로 본다
      HEALTH_REPORT_TO: ${HEALTH_REPORT_TO:-gangd0642@gmail.com}
      MEDIA_HEALTH_URL: http://host.docker.internal:4000/health
      # 토스페이먼츠 자동결제 (비우면 결제 기능 꺼짐)
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      BILLING_KEY_SECRET: ${BILLING_KEY_SECRET:-}
      # 파일 저장소 (local = 아래 볼륨, s3 = AWS S3)
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      S3_PREFIX: ${S3_PREFIX:-prod}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      # AI 회의록·실시간 자막: auto = Claude 키가 있으면 Claude, 없으면 Ollama(profile 에 ollama)
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      AI_CAPTION_PROVIDER: ${AI_CAPTION_PROVIDER:-}
      LIVE_CAPTIONS_ENABLED: ${LIVE_CAPTIONS_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_CAPTION_MODEL: ${OLLAMA_CAPTION_MODEL:-}
      OLLAMA_MAX_CONTEXT: ${OLLAMA_MAX_CONTEXT:-8192}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      TZ: Asia/Seoul
    volumes:
      - uploads:/data/uploads
      # 채팅 첨부파일 (공개 경로가 아님. 서명된 /api/chat/files/{id} 로만 내려받기)
      - chat-files:/data/chat-files
      # 회의 녹화 (주최자 브라우저가 올린 webm. 디스크를 많이 쓰니 남은 용량을 가끔 확인)
      - recordings:/data/recordings
    ports:
      # 사이드카(호스트 네트워크)가 참가 기록을 보내는 내부 콜백용. 외부에는 열리지 않도록 127.0.0.1 에만
      - "127.0.0.1:8080:8080"

  media:
    build:
      context: ..
      dockerfile: apps/media/Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    # WebRTC 미디어 포트 200개를 도커 포트 매핑 없이 그대로 쓰기 위해 호스트 네트워크
    network_mode: host
    environment:
      PORT: "4000"
      ALLOWED_ORIGINS: https://${DOMAIN}
      MEDIA_JWT_SECRET: ${MEDIA_JWT_SECRET}
      MEDIA_INTERNAL_SECRET: ${MEDIA_INTERNAL_SECRET}
      SERVER_INTERNAL_URL: http://127.0.0.1:8080
      # 브라우저가 미디어를 보낼 공인 IP
      ANNOUNCED_ADDRESS: ${PUBLIC_IP:?PUBLIC_IP 를 .env 에 넣어 주세요}
      RTC_MIN_PORT: "40000"
      RTC_MAX_PORT: "40200"
      MEDIASOUP_WORKERS: ${MEDIASOUP_WORKERS:-2}

  # 무료 AI (Ollama, CPU). 밖으로 포트를 열지 않고 server 만 http://ollama:11434 로 부른다.
  # 모델은 처음 쓸 때 메모리에 올라가고(qwen2.5:7b ≈ 5GB, 3b ≈ 2.3GB) keep_alive 가 지나면 내려간다.
  # CPU 를 1개만 쓰게 해서 회의(mediasoup)·서버가 느려지지 않게 한다
  ollama:
    image: ollama/ollama:0.21.1
    profiles: ["ollama"]
    restart: unless-stopped
    mem_limit: ${OLLAMA_MEM_LIMIT:-5g}
    cpus: ${OLLAMA_CPUS:-1.0}
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    volumes:
      - ollama-data:/root/.ollama

  # 처음 한 번 모델 받기 (끝나면 멈춘다)
  ollama-pull:
    image: ollama/ollama:0.21.1
    profiles: ["ollama"]
    restart: "no"
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "sleep 5 && ollama pull ${OLLAMA_MODEL:-qwen2.5:7b} && ( [ -z \"${OLLAMA_CAPTION_MODEL:-}\" ] || ollama pull ${OLLAMA_CAPTION_MODEL:-} )"]

  # 관리자 사이트 (admin.<도메인>). 포트를 밖으로 열지 않고, web(Caddy)이 관리자 도메인 요청을 이쪽으로 넘긴다
  admin:
    build:
      context: ..
      dockerfile: deploy/admin.Dockerfile
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      # 사업자 정보 (전자상거래법 제10조) · 개인정보 보호책임자 (개인정보 보호법 제31조): 빌드할 때 화면에 들어간다
      args:
        VITE_COMPANY_NAME: ${VITE_COMPANY_NAME:-}
        VITE_COMPANY_CEO: ${VITE_COMPANY_CEO:-}
        VITE_COMPANY_BIZ_NO: ${VITE_COMPANY_BIZ_NO:-}
        VITE_COMPANY_MAIL_ORDER_NO: ${VITE_COMPANY_MAIL_ORDER_NO:-}
        VITE_COMPANY_ADDRESS: ${VITE_COMPANY_ADDRESS:-}
        VITE_COMPANY_PHONE: ${VITE_COMPANY_PHONE:-}
        VITE_COMPANY_HOSTING: ${VITE_COMPANY_HOSTING:-}
        VITE_PRIVACY_OFFICER: ${VITE_PRIVACY_OFFICER:-}
        VITE_PRIVACY_OFFICER_CONTACT: ${VITE_PRIVACY_OFFICER_CONTACT:-}
        VITE_POLICY_DATE: ${VITE_POLICY_DATE:-}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
    restart: unless-stopped
    depends_on:
      - server
      - media
      - admin
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN 을 .env 에 넣어 주세요}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN 을 .env 에 넣어 주세요}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      # 호스트 네트워크로 도는 사이드카에 닿기 위해
      - "host.docker.internal:host-gateway"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  oracle-data:
  ollama-data:
  uploads:
  chat-files:
  recordings:
  caddy-data:
  caddy-config:
