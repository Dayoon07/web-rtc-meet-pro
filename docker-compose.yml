services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: wrmp-oracle
    ports:
      # 기본 1522: 로컬에 설치된 Oracle XE(1521)와 겹치지 않게. 서버 기본 DB_URL 도 1522
      - "${ORACLE_PORT:-1522}:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: wrmp
      APP_USER_PASSWORD: wrmp
    volumes:
      - oracle-data:/opt/oracle/oradata
      # 최초 기동(빈 볼륨) 시 APP_USER 스키마에 schema.sql, seed.sql 실행
      - ./db:/db:ro
      - ./docker/oracle/init.sh:/container-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  oracle-data:
